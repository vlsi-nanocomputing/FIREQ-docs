name: Build and deploy FIREQ documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fireq-docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FIREQ-docs
        uses: actions/checkout@v4
        with:
          path: FIREQ-docs

      - name: Checkout FIREQ-Client
        uses: actions/checkout@v4
        with:
          repository: vlsi-nanocomputing/FIREQ-Client
          ref: docs/initial_doc
          path: FIREQ-Client
          token: ${{ secrets.FIREQ_DOCS_PAT }}

      - name: Checkout FIREQ firmware
        uses: actions/checkout@v4
        with:
          repository: vlsi-nanocomputing/FIREQ
          ref: docs/initial_doc
          path: FIREQ
          token: ${{ secrets.FIREQ_DOCS_PAT }}

      - name: Checkout FIREQ-Server
        uses: actions/checkout@v4
        with:
          repository: vlsi-nanocomputing/FIREQ-Server
          ref: docs/initial_doc
          path: FIREQ-Server
          token: ${{ secrets.FIREQ_DOCS_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        working-directory: FIREQ-docs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize component documentation
        working-directory: FIREQ-docs
        run: |
          ./scripts/sync_component_docs.sh

      - name: Build Sphinx documentation
        working-directory: FIREQ-docs
        run: |
          python -m sphinx -b html docs _build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: FIREQ-docs/_build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
