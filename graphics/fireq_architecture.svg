<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 372" width="1230" height="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>FIREQ architecture</title>
  <!-- Palette QNANO: #800033 (bordeaux). All colors are inline attributes for Inkscape/Illustrator compatibility. -->
  <defs>
    <linearGradient id="gClient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3214f"/><stop offset="1" stop-color="#800033"/>
    </linearGradient>
    <linearGradient id="gServer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#920d42"/><stop offset="1" stop-color="#6b002b"/>
    </linearGradient>
    <linearGradient id="gFpga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#800033"/><stop offset="1" stop-color="#55001f"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="blur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- RFSoC boundary -->
  <rect x="445" y="22" width="765" height="330" rx="28" fill="none" stroke="#9b2452" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="782" y="8" width="90" height="28" rx="14" fill="#800033"/>
  <text x="827" y="27" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" font-style="italic">RFSoC</text>

  <!-- ============ FIREQ-Client ============ -->
  <rect x="20" y="60" width="260" height="252" rx="22" fill="url(#gClient)" filter="url(#shadow)"/>
  <text x="150" y="97" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">FIREQ-Client</text>
  <rect x="38" y="115" width="224" height="122" rx="14" fill="#000000" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="250" y="135" text-anchor="end" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" font-style="italic">API</text>
  <rect x="50" y="146" width="104" height="76" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="102" y="180" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Message</text>
  <text x="102" y="199" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Handler</text>
  <rect x="164" y="146" width="86" height="76" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="207" y="189" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Socket</text>
  <rect x="38" y="248" width="224" height="40" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="150" y="273" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Plotter</text>
  <rect x="95" y="298" width="110" height="28" rx="14" fill="#ffffff" stroke="#800033" stroke-width="2"/>
  <text x="150" y="317" text-anchor="middle" fill="#800033" font-size="13" font-weight="700">USER PC</text>

  <!-- ============ FIREQ-Server ============ -->
  <rect x="470" y="60" width="290" height="252" rx="22" fill="url(#gServer)" filter="url(#shadow)"/>
  <text x="615" y="97" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">FIREQ-Server</text>
  <rect x="488" y="115" width="254" height="173" rx="14" fill="#000000" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="730" y="135" text-anchor="end" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" font-style="italic">API</text>
  <rect x="502" y="146" width="108" height="54" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="556" y="178" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Sender</text>
  <rect x="620" y="146" width="108" height="54" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="674" y="178" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Receiver</text>
  <rect x="502" y="214" width="226" height="54" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="615" y="246" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Hardware API</text>
  <rect x="565" y="298" width="100" height="28" rx="14" fill="#ffffff" stroke="#800033" stroke-width="2"/>
  <text x="615" y="317" text-anchor="middle" fill="#800033" font-size="13" font-weight="700">PS</text>

  <!-- ============ FIREQ (FPGA) ============ -->
  <rect x="900" y="60" width="280" height="252" rx="22" fill="url(#gFpga)" filter="url(#shadow)"/>
  <text x="1040" y="97" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">FIREQ</text>
  <rect x="918" y="122" width="118" height="70" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="977" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Generator</text>
  <rect x="1044" y="122" width="118" height="70" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="1103" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Trigger</text>
  <rect x="918" y="204" width="118" height="70" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="977" y="244" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">Acquisition</text>
  <rect x="1044" y="204" width="118" height="70" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="1103" y="244" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="500">DMA</text>
  <rect x="990" y="298" width="100" height="28" rx="14" fill="#ffffff" stroke="#800033" stroke-width="2"/>
  <text x="1040" y="317" text-anchor="middle" fill="#800033" font-size="13" font-weight="700">FPGA</text>

  <!-- ============ Client ⇄ Server ============ -->
  <!-- experiment.yaml: Client → Server -->
  <line x1="290" y1="152" x2="458" y2="152" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="313" y="118" width="124" height="24" rx="12" fill="#ffffff" stroke="#e2c2ce" stroke-width="1"/>
  <text x="375" y="134" text-anchor="middle" fill="#3a0017" font-size="12" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">experiment.yaml</text>

  <!-- command: Client → Server -->
  <line x1="290" y1="204" x2="458" y2="204" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="333" y="170" width="84" height="24" rx="12" fill="#ffffff" stroke="#e2c2ce" stroke-width="1"/>
  <text x="375" y="186" text-anchor="middle" fill="#3a0017" font-size="12.5" font-weight="600">command</text>

  <!-- raw byte: Server → Client -->
  <line x1="458" y1="256" x2="290" y2="256" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="333" y="222" width="84" height="24" rx="12" fill="#ffffff" stroke="#e2c2ce" stroke-width="1"/>
  <text x="375" y="238" text-anchor="middle" fill="#3a0017" font-size="12.5" font-weight="600">raw byte</text>

  <!-- ============ Server ⇄ FPGA (AXI) ============ -->
  <!-- Server → FPGA -->
  <line x1="768" y1="168" x2="892" y2="168" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
  <!-- FPGA → Server -->
  <line x1="892" y1="238" x2="768" y2="238" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="778" y="191" width="104" height="24" rx="12" fill="#ffffff" stroke="#e2c2ce" stroke-width="1"/>
  <text x="830" y="207" text-anchor="middle" fill="#3a0017" font-size="12.5" font-weight="600">AXI Interfaces</text>
</svg>
